services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_CONSUMER_USER: ${POSTGRES_CONSUMER_USER}
      POSTGRES_CONSUMER_PASSWORD: ${POSTGRES_CONSUMER_PASSWORD}
      POSTGRES_ETL_USER: ${POSTGRES_ETL_USER}
      POSTGRES_ETL_PASSWORD: ${POSTGRES_ETL_PASSWORD}
      LOGGER_USER: ${LOGGER_USER}
      LOGGER_PASSWORD: ${LOGGER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    networks:
      - etl_store_network
      - backend_store_network
    ports:
      - "127.0.0.1:5433:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_CONSUMER_USER: ${POSTGRES_CONSUMER_USER}
      POSTGRES_CONSUMER_PASSWORD: ${POSTGRES_CONSUMER_PASSWORD}
      BACKEND_PORT: ${BACKEND_PORT}
      CLICKHOUSE_HTTP_PORT: ${CLICKHOUSE_HTTP_PORT}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      LOGGER_USER: ${LOGGER_USER}
      LOGGER_PASSWORD: ${LOGGER_PASSWORD}
    ports:
      - "127.0.0.1:8001:${BACKEND_PORT}"
    networks:
      - backend_store_network
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:25.1.2.3
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: ${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT}
      LOGGER_USER: ${LOGGER_USER}
      LOGGER_PASSWORD: ${LOGGER_PASSWORD}
    ports:
      - "127.0.0.1:8124:${CLICKHOUSE_HTTP_PORT}"
      - "127.0.0.1:9001:${CLICKHOUSE_APPLICATION_PORT}"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init_clickhouse.sh:/docker-entrypoint-initdb.d/init-clickhouse.sh
    networks:
      - etl_store_network
      - backend_store_network
    healthcheck:
      test: ["CMD", "clickhouse", "client", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  clickhouse_data:

networks:
  etl_store_network:
    external: true
    name: etl_store_network
  backend_store_network:
    name: backend_store_network