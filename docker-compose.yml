services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_CONSUMER_USER: ${POSTGRES_CONSUMER_USER}
      POSTGRES_CONSUMER_PASSWORD: ${POSTGRES_CONSUMER_PASSWORD}
      POSTGRES_ETL_USER: ${POSTGRES_ETL_USER}
      POSTGRES_ETL_PASSWORD: ${POSTGRES_ETL_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    ports:
      - "127.0.0.1:5433:${POSTGRES_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_CONSUMER_USER: ${POSTGRES_CONSUMER_USER}
      POSTGRES_CONSUMER_PASSWORD: ${POSTGRES_CONSUMER_PASSWORD}
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "127.0.0.1:8001:${BACKEND_PORT}"
    depends_on:
      - postgres

volumes:
  postgres_data: